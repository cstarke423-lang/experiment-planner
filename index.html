<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment Planner</title>
</head>

<body>

    <h1>Experiment Planner</h1>

    <p>
        Turn your research question into a structured experimental plan.
    </p>

    <h2>Start Your Experiment</h2>

    <label for="research-question">Research Question</label>

    <br>

    <textarea
        id="research-question"
        rows="5"
        cols="60"
        placeholder="Example: Does treatment X increase T-cell proliferation compared with the control?"
    ></textarea>

</body>

</html>
