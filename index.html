<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Experiment Planner</title>
    <link rel="stylesheet" href="style.css">
</head>

<body>

    <div class="container">

        <header>
            <h1>Experiment Planner</h1>
            <p class="subtitle">
                Turn your research question into a structured experimental plan.
            </p>
        </header>

        <main>
            <section class="card">

                <h2>Start Your Experiment</h2>

                <label for="research-question">
                    Research Question
                </label>

                <textarea
                    id="research-question"
                    rows="5"
                    placeholder="Example: Does treatment X increase T-cell proliferation compared with the control?"
                ></textarea>

                <button type="button">
                    Build My Experiment
                </button>

            </section>
        </main>

    </div>

</body>

</html>
